name: Verify and deploy portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - name: Test the restricted VM01 deployer and rollback
        run: python3 -m unittest discover -s tests/deployment -v
      - run: npm run build
      - run: node --check dist/app.bundle.js
      - name: Prepare the production artifact
        run: node scripts/ci/package.mjs "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-${{ github.sha }}
          path: |
            outputs/ci-package/site.tar.gz
            outputs/ci-package/manifest.json
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/codex/public-portfolio' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vm01-production
      url: https://victor.woelffel.com/
    concurrency:
      group: portfolio-vm01-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portfolio-${{ github.sha }}
          path: outputs/ci-package
      - name: Publish atomically on VM01 and verify HTTPS
        env:
          VM01_DEPLOY_KEY: ${{ secrets.VM01_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM01_DEPLOY_KEY" || { echo 'Missing VM01_DEPLOY_KEY in vm01-production' >&2; exit 1; }
          key_file="$RUNNER_TEMP/portfolio-vm01-key"
          trap 'rm -f -- "$key_file"' EXIT
          umask 077
          printf '%s\n' "$VM01_DEPLOY_KEY" > "$key_file"
          unset VM01_DEPLOY_KEY
          VM01_SSH_KEY_FILE="$key_file" node scripts/ci/deploy.mjs "$GITHUB_SHA"
